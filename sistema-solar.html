	<script>
		// A beirada do Sol, na mesma escala dos planetas da arte. Júpiter ocupa 25,5% da largura da
		// fileira e o Sol é quase 10 vezes mais largo que ele: o Sol teria 2,5 vezes a largura da
		// fileira inteira. Por isso só cabe a beirada, uma curva enorme que ocupa a altura toda da
		// tela, entrando pela esquerda. O desenho segue a pixel art do Sol (a mesma paleta, os veios
		// marrons e as explosões de raios amarelos), só que com mais detalhe, porque é um zoom.
		(function () {
			var link = document.querySelector('.sol-borda'), sistema = document.getElementById('sistema'), main = document.querySelector('main.inicio');
			if (!link || !sistema) return;
			var tela = link.querySelector('canvas'), nome = link.querySelector('.sol-borda-nome'), ctx = tela.getContext('2d');
			var brilho = document.createElement('span');
			brilho.className = 'sol-borda-brilho';
			brilho.setAttribute('aria-hidden', 'true');
			link.insertBefore(brilho, tela);
			var calmo = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
			function cor(h) { return (255 << 24 | parseInt(h.substr(5, 2), 16) << 16 | parseInt(h.substr(3, 2), 16) << 8 | parseInt(h.substr(1, 2), 16)) >>> 0; }
			// a paleta da pixel art do Sol
			var ESCURO = cor('#573312'), MARROM = cor('#91561e'), LARANJA = cor('#ce8e33'), CLARO = cor('#f0d17c'), BRANCO = cor('#fff6e0');
			var BRILHO = [cor('#ffb347'), cor('#e07a2a'), cor('#a8501e')];
			var LIM16 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
			function hash(x, y) { var n = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0; n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967295; }
			function ruido(x, y) {
				var xi = Math.floor(x), yi = Math.floor(y), u = x - xi, v = y - yi;
				u = u * u * (3 - 2 * u); v = v * v * (3 - 2 * v);
				var a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
				return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
			}
			function fbm(x, y) { return ruido(x, y) * 0.55 + ruido(x * 2.1 + 7, y * 2.1) * 0.3 + ruido(x * 4.3 + 3, y * 4.3 + 9) * 0.15; }
			/* (os planetas aparecem a 82% do tamanho da arte, para sobrar espaço para as órbitas das luas; o Sol acompanha) */
			var ESCALA_PLANETAS = 0.82;
			var P, CW, CH, img, buf, R, cx, cy, borda, halo, explosoes;
			function medir() {
				var rm = main.getBoundingClientRect(), rs = sistema.getBoundingClientRect(), W = rs.width;
				P = W > 700 ? 4 : 3; // o tamanho de cada pixel da arte na tela
				borda = rs.left - rm.left - 0.03 * W; // onde fica a beirada: com folga antes de Mercúrio, para ele não ficar no brilho
				halo = Math.max(36, 0.07 * W);
				R = 0.25489 * ESCALA_PLANETAS * 9.96 / 2 * W; cx = borda - R; cy = rs.top - rm.top + rs.height / 2;
				var largura = Math.max(10, borda + 2), altura = rm.height;
				link.style.width = largura + 'px'; link.style.height = altura + 'px';
				// o brilho atrás, suave e pulsando (como o da página do Sol): um círculo enorme, do
				// tamanho do Sol mais o brilho, com um degradê que só aparece em volta da beirada
				var fora = Math.max(70, 0.11 * W), raio = R + fora, p = R / raio * 100;
				brilho.style.left = (cx - raio) + 'px'; brilho.style.top = (cy - raio) + 'px';
				brilho.style.width = brilho.style.height = raio * 2 + 'px';
				brilho.style.background = 'radial-gradient(closest-side, rgba(255, 236, 160, 0.95) ' + (p - 1).toFixed(2) + '%, rgba(255, 196, 77, 0.7) ' + (p + (100 - p) * 0.12).toFixed(2) + '%, rgba(255, 140, 30, 0.32) ' + (p + (100 - p) * 0.35).toFixed(2) + '%, rgba(255, 90, 0, 0.1) ' + (p + (100 - p) * 0.65).toFixed(2) + '%, transparent 100%)';
				CW = Math.ceil(largura / P); CH = Math.ceil(altura / P);
				tela.width = CW; tela.height = CH;
				img = ctx.createImageData(CW, CH); buf = new Uint32Array(img.data.buffer);
				nome.style.left = Math.max(8, borda - 60) + 'px'; nome.style.top = cy + 'px';
				// as explosões de raios (como na arte), espalhadas pelo pedaço que aparece
				explosoes = [];
				var s = 7;
				for (var i = 0; i < 24; i++) {
					s = (s * 16807) % 2147483647; var a = s / 2147483647;
					s = (s * 16807) % 2147483647; var b = s / 2147483647;
					s = (s * 16807) % 2147483647; var c = s / 2147483647;
					var y = b * altura, x = borda - 12 - a * Math.max(30, borda * 0.9);
					explosoes.push([x / P, y / P, (14 + c * 22) / P * 3, c * 6]);
				}
			}
			function desenhar(t) {
				for (var j = 0; j < CH; j++) for (var i = 0; i < CW; i++) {
					var X = (i + 0.5) * P, Y = (j + 0.5) * P, k = j * CW + i;
					var e = R - Math.sqrt((X - cx) * (X - cx) + (Y - cy) * (Y - cy)); // quanto o ponto está para dentro do Sol (em px)
					var lim = LIM16[(i & 3) + ((j & 3) << 2)] / 16;
					if (e < 0) { buf[k] = 0; continue; } // fora do Sol: transparente (o brilho suave fica atrás, no .sol-borda-brilho)
					if (e < P * 1.5) { buf[k] = CLARO; continue; } // a borda amarela, como na arte
					if (e < P * 3) { buf[k] = LARANJA; continue; }
					// os veios marrons ondulados (cristas do ruído, com o espaço entortado)
					var u = i * P / 46, v = j * P / 46;
					var wx = fbm(u * 0.7 + 3, v * 0.7 + t * 0.03) - 0.5, wy = fbm(u * 0.7, v * 0.7 + 5 - t * 0.03) - 0.5;
					var crista = 1 - Math.abs(2 * fbm(u + wx * 1.6, v + wy * 1.6) - 1);
					var mancha = fbm(u * 0.8 + 11, v * 0.8 + 4);
					var c = crista > 0.84 ? ESCURO : crista > 0.7 ? MARROM : mancha > 0.7 ? CLARO : LARANJA;
					// as explosões: raios amarelos saindo de um miolo branco
					for (var q = 0; q < explosoes.length; q++) {
						var ex = explosoes[q], dx = i - ex[0], dy = j - ex[1];
						if (Math.abs(dx) > ex[2] || Math.abs(dy) > ex[2]) continue;
						var d = Math.sqrt(dx * dx + dy * dy) / ex[2];
						if (d > 1) continue;
						var raio = Math.pow(Math.max(0, Math.cos(Math.atan2(dy, dx) * 5 + ex[3] + Math.sin(d * 4) * 0.5)), 14) * (1 - d * 0.8); // raios finos, levemente tortos
						if (d < 0.05 + Math.sin(t * 2 + ex[3]) * 0.015) c = BRANCO;
						else if (raio > 0.3 || d < 0.12) c = CLARO;
						else if (raio > 0.15 && c === ESCURO) c = MARROM;
					}
					buf[k] = c;
				}
				ctx.putImageData(img, 0, 0);
			}
			var inicio = performance.now();
			function refazer() { medir(); desenhar(calmo ? 0 : (performance.now() - inicio) / 1000); }
			refazer();
			var espera;
			window.addEventListener('resize', function () { clearTimeout(espera); espera = setTimeout(refazer, 150); });
			if (document.fonts && document.fonts.ready) document.fonts.ready.then(refazer); // o título pode mudar de tamanho quando a fonte chega
			if (calmo) return;
			setInterval(function () { desenhar((performance.now() - inicio) / 1000); }, 200);
		})();	</script>
	<script>
		// Destaca o planeta (com brilho rosa) ao passar o mouse nele ou no nome
		(function () {
			var sistema = document.getElementById('sistema');
			var alvos = document.querySelectorAll('[data-id]');
			var info = document.getElementById('info');
			var vazio = info.innerHTML;
			// posição e lema de cada astro (os lemas vêm do primeiro título de cada página), no idioma da visita
			var T = window.T || function (pt) { return pt; };
			var DADOS = {
				mercurio: [T('1º planeta', '1st planet'), T('Mercúrio', 'Mercury'), T('O pequeno mensageiro do Sol', 'The little messenger of the Sun'), '#a9b8ff'],
				venus: [T('2º planeta', '2nd planet'), T('Vênus', 'Venus'), T('Um astro brilhante', 'A brilliant star'), '#f5a83c'],
				terra: [T('3º planeta', '3rd planet'), T('Terra', 'Earth'), T('O planeta azul', 'The blue planet'), '#6f9bff'],
				marte: [T('4º planeta', '4th planet'), T('Marte', 'Mars'), T('O planeta vermelho', 'The red planet'), '#e8906c'],
				jupiter: [T('5º planeta', '5th planet'), T('Júpiter', 'Jupiter'), T('O rei dos planetas', 'The king of the planets'), '#e6c49a'],
				saturno: [T('6º planeta', '6th planet'), T('Saturno', 'Saturn'), T('O senhor dos anéis', 'The lord of the rings'), '#e3cc8f'],
				urano: [T('7º planeta', '7th planet'), T('Urano', 'Uranus'), T('O planeta deitado', 'The planet lying on its side'), '#a8ecf5'],
				netuno: [T('8º planeta', '8th planet'), T('Netuno', 'Neptune'), T('O planeta encontrado pela matemática', 'The planet found by mathematics'), '#6b95ff'],
				sol: [T('A nossa estrela', 'Our star'), T('Sol', 'Sun'), T('A estrela que nos dá vida', 'The star that gives us life'), '#ffc04d'],
				lua: [T('A lua da Terra', 'Earth\'s moon'), T('Lua', 'Moon'), T('A nossa companheira de sempre', 'Our constant companion'), '#cfd3dc'],
				io: [T('Uma lua de Júpiter', 'A moon of Jupiter'), T('Io', 'Io'), T('O mundo dos vulcões', 'The world of volcanoes'), '#f0d040'],
				europa: [T('Uma lua de Júpiter', 'A moon of Jupiter'), T('Europa', 'Europa'), T('Um oceano escondido embaixo do gelo', 'An ocean hidden under the ice'), '#e8d8c0'],
				ganimedes: [T('Uma lua de Júpiter', 'A moon of Jupiter'), T('Ganimedes', 'Ganymede'), T('A maior lua do Sistema Solar', 'The largest moon in the Solar System'), '#c8b8a0'],
				tita: [T('Uma lua de Saturno', 'A moon of Saturn'), T('Titã', 'Titan'), T('A lua com céu, chuva e mares', 'The moon with sky, rain and seas'), '#e8a850'],
				encelado: [T('Uma lua de Saturno', 'A moon of Saturn'), T('Encélado', 'Enceladus'), T('A lua dos gêiseres de gelo', 'The moon of icy geysers'), '#e8f4ff'],
				mimas: [T('Uma lua de Saturno', 'A moon of Saturn'), T('Mimas', 'Mimas'), T('A lua com uma cratera gigante', 'The moon with a giant crater'), '#c8c8c4'],
				miranda: [T('Uma lua de Urano', 'A moon of Uranus'), T('Miranda', 'Miranda'), T('A colcha de retalhos de Urano', 'The patchwork moon of Uranus'), '#b8b4b8'],
				tritao: [T('Uma lua de Netuno', 'A moon of Neptune'), T('Tritão', 'Triton'), T('A lua que anda na contramão', 'The moon that goes the wrong way'), '#e0c8c4']
			};
			var timer;
			function destacar(id) {
				sistema.classList.toggle('focado', !!id && !!sistema.querySelector('.astro[data-id="' + id + '"]'));
				alvos.forEach(function (el) { el.classList.toggle('ativo', !!id && el.getAttribute('data-id') === id); });
				clearTimeout(timer);
				if (!id) { timer = setTimeout(function () { info.innerHTML = vazio; info.classList.remove('cheio'); }, 400); return; }
				var d = DADOS[id];
				info.style.setProperty('--cor-destino', d[3]);
				info.innerHTML = '<p class="cartao-tipo">' + d[0] + '</p><p class="info-nome">' + d[1] + '</p><p class="info-lema">' + d[2] + '</p><a class="botao-hud" href="' + id + '.html">' + T('Visitar', 'Visit') + ' &rarr;</a>';
				info.classList.add('cheio');
			}
			info.addEventListener('mouseenter', function () { clearTimeout(timer); });
			alvos.forEach(function (el) {
				var id = el.getAttribute('data-id');
				el.addEventListener('mouseenter', function () { destacar(id); });
				el.addEventListener('mouseleave', function () { destacar(null); });
				el.addEventListener('focus', function () { destacar(id); });
				el.addEventListener('blur', function () { destacar(null); });
			});
			// a faixa dos planetas passa por cima do meio do Sol: onde ela não tem planeta, o mouse e o
			// clique "atravessam" até o Sol (que leva direto para a página dele)
			var faixa = document.querySelector('.rolagem'), sol = document.querySelector('.sol-borda'), sobreSol = false;
			function noSol(e) {
				if (!faixa || !sol || e.target.closest('.astro')) return false;
				var r = sol.getBoundingClientRect();
				return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
			}
			if (faixa && sol) {
				faixa.addEventListener('mousemove', function (e) {
					var agora = noSol(e);
					if (agora === sobreSol) return;
					sobreSol = agora; faixa.style.cursor = agora ? 'pointer' : '';
					sol.classList.toggle('ativo', agora); destacar(agora ? 'sol' : null);
				});
				faixa.addEventListener('mouseleave', function () { if (sobreSol) { sobreSol = false; faixa.style.cursor = ''; sol.classList.remove('ativo'); destacar(null); } });
				faixa.addEventListener('click', function (e) { if (noSol(e)) { e.preventDefault(); sol.click(); } });
			}
		})();
	</script>
	<script>
		// As luas dando voltas nos seus planetas, na própria imagem do sistema. Cada uma: o planeta,
		// o tamanho da órbita (em raios do globo do planeta), o achatamento e a inclinação da elipse
		// (as luas de Urano giram "em pé", como o planeta deitado; Tritão vai inclinado e na contramão),
		// o tempo de uma volta (em segundos, só para a animação) e o tamanho da lua (em % da largura; bem maior
		// que o de verdade, para dar para ver e clicar).
		(function () {
			var sistema = document.getElementById('sistema'), svg = sistema.querySelector('.orbitas-luas');
			var calmo = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
			var LUAS = {
				/* (inclinações de verdade: a Lua quase no plano da órbita da Terra; as de Júpiter e Saturno no
				   equador deles, junto dos anéis; as de Urano "em pé", porque o planeta é deitado; Tritão
				   inclinado e na contramão) */
				lua: { pai: 'terra', r: 1.75, ach: 0.3, incl: -5, volta: 28, tam: 1.4, fase: 1.2 },
				io: { pai: 'jupiter', r: 1.14, ach: 0.3, incl: -3, volta: 10, tam: 1.3, fase: 0.3 },
				europa: { pai: 'jupiter', r: 1.28, ach: 0.3, incl: -3, volta: 16, tam: 1.2, fase: 2.4 },
				ganimedes: { pai: 'jupiter', r: 1.42, ach: 0.3, incl: -3, volta: 25, tam: 1.6, fase: 4.4 },
				mimas: { pai: 'saturno', r: 1.62, ach: 0.3, incl: 0, volta: 11, tam: 0.95, fase: 1.0 },
				encelado: { pai: 'saturno', r: 1.82, ach: 0.3, incl: 0, volta: 15, tam: 1.05, fase: 3.6 },
				tita: { pai: 'saturno', r: 2.05, ach: 0.3, incl: 0, volta: 27, tam: 1.55, fase: 5.3 },
				miranda: { pai: 'urano', r: 1.5, ach: 0.3, incl: 82, volta: 14, tam: 1.05, fase: 0.8 },
				tritao: { pai: 'netuno', r: 1.45, ach: 0.4, incl: -28, volta: -22, tam: 1.25, fase: 2.0 }
			};
			/* o raio do globo, em fração da largura da arte (Saturno é mais largo por causa dos anéis) */
			var GLOBO = { saturno: 0.265 };
			var luas = [].slice.call(sistema.querySelectorAll('.lua-orbita')), parado = false;
			luas.forEach(function (el) {
				el.addEventListener('mouseenter', function () { parado = true; });
				el.addEventListener('mouseleave', function () { parado = false; });
				el.addEventListener('focus', function () { parado = true; });
				el.addEventListener('blur', function () { parado = false; });
			});
			var NS = 'http://www.w3.org/2000/svg', elipses = {};
			Object.keys(LUAS).forEach(function (id) { var e = document.createElementNS(NS, 'ellipse'); e.setAttribute('class', 'orbita-' + LUAS[id].pai); svg.appendChild(e); elipses[id] = e; });
			var tempo = 0, antes = performance.now();
			function quadro(agora) {
				if (!parado && !calmo) tempo += (agora - antes) / 1000;
				antes = agora;
				var rs = sistema.getBoundingClientRect(), W = rs.width;
				svg.setAttribute('viewBox', '0 0 ' + rs.width + ' ' + rs.height);
				/* o espaço livre de cada planeta até os vizinhos: as órbitas dele encolhem para caber ali,
				   e nenhuma lua passa por cima de outro planeta */
				var planetas = [].slice.call(sistema.querySelectorAll('.astro:not(.lua-orbita)')).map(function (p) { var r = p.getBoundingClientRect(); return { id: p.getAttribute('data-id'), l: r.left - rs.left, r: r.right - rs.left, w: r.width }; });
				var escala = {};
				Object.keys(LUAS).forEach(function (id) {
					var L = LUAS[id], eu = planetas.filter(function (p) { return p.id === L.pai; })[0]; if (!eu) return;
					var cx = (eu.l + eu.r) / 2, livre = Infinity;
					planetas.forEach(function (p) { if (p.id === L.pai) return; var folga = p.w * 0.06; livre = Math.min(livre, p.l + folga > cx ? p.l + folga - cx : cx - (p.r - folga)); });
					var R = eu.w * (GLOBO[L.pai] || 0.5), inc = L.incl * Math.PI / 180, rx = R * L.r, ry = rx * L.ach;
					var largura = Math.sqrt(Math.pow(rx * Math.cos(inc), 2) + Math.pow(ry * Math.sin(inc), 2)) + Math.max(W < 700 ? 6 : 12, W * L.tam / 100) / 2 + 3;
					escala[L.pai] = Math.min(escala[L.pai] || 1, livre / largura);
				});
				luas.forEach(function (el) {
					var id = el.getAttribute('data-id'), L = LUAS[id], pai = sistema.querySelector('.astro[data-id="' + L.pai + '"]');
					if (!pai) return;
					var rp = pai.getBoundingClientRect(), cx = rp.left - rs.left + rp.width / 2, cy = rp.top - rs.top + rp.height / 2;
					var R = rp.width * (GLOBO[L.pai] || 0.5), rx = R * L.r * Math.max(0.4, escala[L.pai] || 1), ry = rx * L.ach, inc = L.incl * Math.PI / 180;
					var a = L.fase + tempo / L.volta * Math.PI * 2, ex = Math.cos(a) * rx, ey = Math.sin(a) * ry;
					var x = cx + ex * Math.cos(inc) - ey * Math.sin(inc), y = cy + ex * Math.sin(inc) + ey * Math.cos(inc);
					var tam = Math.max(W < 700 ? 6 : 12, W * L.tam / 100);
					el.style.width = tam + 'px'; el.style.left = (x - tam / 2) + 'px'; el.style.top = (y - tam / 2) + 'px';
					/* na metade de trás da órbita, a lua passa atrás do planeta */
					el.style.zIndex = Math.sin(a) < 0 ? 1 : 4;
					var e = elipses[id];
					e.setAttribute('cx', cx); e.setAttribute('cy', cy); e.setAttribute('rx', rx); e.setAttribute('ry', ry);
					e.setAttribute('transform', 'rotate(' + L.incl + ' ' + cx + ' ' + cy + ')');
				});
				requestAnimationFrame(quadro);
			}
			requestAnimationFrame(quadro);
		})();
	</script>
